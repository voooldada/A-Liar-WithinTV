<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A Liar Within — TV Broadcast</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f3f3f3;
      background: linear-gradient(180deg, rgba(12, 24, 48, 0.88), rgba(18, 32, 62, 0.92)),
        url('gameart/DayPhase.jpeg') center/cover no-repeat;
      background-attachment: fixed;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top center, rgba(255, 240, 170, 0.14), transparent 25%);
      pointer-events: none;
    }

    .tv-container {
      position: relative;
      width: min(720px, 100%);
      padding: 42px 36px;
      border-radius: 24px;
      background: rgba(7, 14, 28, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .tv-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 153, 56, 0.05), transparent 30%);
      pointer-events: none;
    }

    .tv-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 10px;
      color: #ffd87e;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.95;
    }

    .tv-title {
      font-size: clamp(2rem, 2.5vw, 3.2rem);
      margin-bottom: 0.25rem;
      color: #fff;
      text-shadow: 0 0 28px rgba(255, 215, 120, 0.18);
    }

    .tv-subtitle {
      margin-bottom: 1.8rem;
      color: #dfc87f;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
    }

    .instructions {
      display: grid;
      gap: 0.85rem;
      margin-bottom: 24px;
      color: #d7d7e2;
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .instruction-step {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      color: #f0f0f5;
    }

    .instruction-step strong {
      display: inline-flex;
      min-width: 2rem;
      justify-content: center;
      color: #ffb86c;
    }

    .tv-status {
      margin-top: 10px;
      margin-bottom: 20px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #c9d5ff;
      font-size: 0.95rem;
      text-align: left;
      line-height: 1.5;
    }

    .tv-field {
      display: grid;
      gap: 12px;
      margin-top: 14px;
      text-align: left;
      color: #ccc;
    }

    .tv-field label {
      font-size: 0.95rem;
      color: #bfc7dd;
    }

    .tv-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(18, 26, 44, 0.9);
      color: #f3f3f3;
      font-size: 1rem;
      outline: none;
    }

    .tv-input:focus {
      border-color: rgba(255, 135, 93, 0.9);
      box-shadow: 0 0 0 4px rgba(255, 135, 93, 0.14);
    }

    .tv-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    .tv-connect-button {
      flex: 1;
      min-width: 180px;
      padding: 14px 18px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #8f1f34, #cd4b60);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .tv-connect-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 18px 34px rgba(205, 75, 96, 0.28);
    }

    .tv-note {
      color: #9fb3d4;
      font-size: 0.9rem;
      min-height: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="tv-container">
    <div class="tv-brand">A Liar Within</div>
    <h1 class="tv-title">TV Broadcast</h1>
      <h2 class="tv-subtitle">Ready to display room status</h2>

      <div class="instructions">
        <div class="instruction-step">
          <strong>1.</strong> Open the game on your device
        </div>
        <div class="instruction-step">
          <strong>2.</strong> Tap "Connect to TV" in the lobby
        </div>
        <div class="instruction-step">
          <strong>3.</strong> Paste the room code into the field below
        </div>
        <div class="instruction-step">
          <strong>4.</strong> Click "Connect as Spectator" to start the broadcast
        </div>
      </div>

      <div class="tv-status">
        Status: <span id="tv-connection-status">Ready to broadcast</span>
      </div>

      <div class="tv-field">
        <label for="tv-room-input">Room Code</label>
        <input id="tv-room-input" class="tv-input" placeholder="Paste the room code (eg: ABCD1234)" />
        <div class="tv-actions">
          <button id="tv-connect-button" class="tv-connect-button">Connect as Spectator</button>
      </div>
      <div id="tv-connect-msg" class="tv-note"></div>

  <script>
    const backgroundImages = [
      'gameart/CityDay.jpeg',
      'gameart/CityNight.jpeg',
      'gameart/Night.jpeg',
      'gameart/DayPhase.jpeg',
      'gameart/Voting.jpeg'
    ];
    const selectedBackground = backgroundImages[Math.floor(Math.random() * backgroundImages.length)];
    document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.70), rgba(0,0,0,0.70)), url('${selectedBackground}')`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';

    // Eventos do UI
    document.getElementById('tv-connect-button').addEventListener('click', () => {
      const room = document.getElementById('tv-room-input').value.toUpperCase().trim();
      const msg = document.getElementById('tv-connect-msg');
      if (!room) { msg.textContent = 'Please enter the room code.'; return; }
      // Redirect to spectator.html with room (the spectator page auto-joins)
      const url = 'spectator.html?room=' + encodeURIComponent(room);
      window.location.href = url;
    });
  </script>
</body>
</html>
